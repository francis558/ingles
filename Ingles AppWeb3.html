<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilingüe · Panel de estudio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: #f2f5f9;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      background: white;
      border-radius: 32px;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.2);
      padding: 28px 30px 35px;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .app-header h1 {
      font-weight: 600;
      font-size: 1.9rem;
      color: #0b1b33;
      letter-spacing: -0.5px;
    }

    .app-header h1 i {
      color: #2a7de1;
      margin-right: 8px;
    }

    .login-area {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f0f4fe;
      padding: 6px 16px 6px 20px;
      border-radius: 40px;
    }

    .login-area span {
      font-weight: 500;
      color: #1f3a6b;
    }

    .btn {
      border: none;
      background: transparent;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: #2a7de1;
      color: white;
    }
    .btn-primary:hover {
      background: #1b62b5;
    }

    .btn-outline {
      border: 1.5px solid #2a7de1;
      color: #2a7de1;
      background: white;
    }
    .btn-outline:hover {
      background: #e9f0fe;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }
    .btn-danger:hover {
      background: #b02a37;
    }

    .btn-success {
      background: #28a745;
      color: white;
    }
    .btn-success:hover {
      background: #1e7e34;
    }

    .btn-sm {
      padding: 4px 14px;
      font-size: 0.8rem;
    }

    .search-section {
      margin-bottom: 28px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #f0f4fa;
      border-radius: 60px;
      padding: 6px 6px 6px 24px;
      border: 1px solid #d9e2ef;
    }

    .search-box i {
      color: #6f7e95;
      font-size: 1.1rem;
    }

    .search-box input {
      border: none;
      background: transparent;
      padding: 14px 16px;
      width: 100%;
      font-size: 1rem;
      outline: none;
    }

    .search-box input::placeholder {
      color: #8a9bb0;
    }

    .add-form {
      background: #f8fafd;
      border-radius: 24px;
      padding: 18px 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 18px;
      margin-bottom: 30px;
      border: 1px solid #e3ebf6;
    }

    .add-form .field-group {
      flex: 1 1 200px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .add-form .field-group label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #3a5478;
    }

    .add-form .field-group input {
      background: white;
      border: 1px solid #ccd9eb;
      border-radius: 40px;
      padding: 12px 18px;
      font-size: 0.95rem;
      outline: none;
      transition: 0.1s;
    }

    .add-form .field-group input:focus {
      border-color: #2a7de1;
      box-shadow: 0 0 0 3px rgba(42, 125, 225, 0.15);
    }

    .add-form .btn {
      align-self: flex-end;
      padding: 12px 28px;
      background: #1f3a6b;
      color: white;
      border-radius: 60px;
      font-weight: 600;
      border: none;
      margin-top: 4px;
    }
    .add-form .btn:hover {
      background: #142b4f;
    }

    .table-responsive {
      overflow-x: auto;
      border-radius: 20px;
      border: 1px solid #e6edf6;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      min-width: 600px;
    }

    th {
      text-align: left;
      padding: 14px 18px;
      background: #f4f8ff;
      font-weight: 600;
      color: #1f3a6b;
      border-bottom: 2px solid #d9e2ef;
      font-size: 0.85rem;
    }

    td {
      padding: 14px 18px;
      border-bottom: 1px solid #eef3f9;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .col-ingles {
      font-weight: 500;
      color: #0b1b33;
    }

    .col-espanol {
      color: #2d4059;
    }

    .acciones {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty-message {
      text-align: center;
      padding: 40px 20px;
      color: #6f7e95;
      font-size: 1rem;
    }

    .toast {
      background: #1f3a6b;
      color: white;
      padding: 12px 24px;
      border-radius: 60px;
      font-weight: 500;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 999;
      opacity: 0;
      transition: 0.25s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      pointer-events: auto;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.9rem;
      color: #3a5478;
    }

    .btn-export, .btn-import {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-export:hover {
      background: #1e7e34;
    }
    .btn-import {
      background: #6f42c1;
    }
    .btn-import:hover {
      background: #5a32a3;
    }

    .file-input-hidden {
      display: none;
    }

    @media (max-width: 700px) {
      .app-container { padding: 16px; }
      .app-header { flex-direction: column; align-items: stretch; gap: 14px; }
      .login-area { justify-content: space-between; }
      .stats { flex-direction: column; align-items: stretch; }
      .stats > div { display: flex; flex-wrap: wrap; gap: 8px; }
    }
  </style>
</head>
<body>
<div class="app-container" id="app">
  <div id="toast" class="toast">Mensaje</div>

  <header class="app-header">
    <h1><i class="fas fa-language"></i> Bilingüe <span style="font-size:0.8rem;font-weight:400;color:#6f7e95;">+800 expresiones</span></h1>
    <div class="login-area">
      <span id="userStatus"><i class="fas fa-user-circle"></i> Invitado</span>
      <div id="authButtons">
        <button class="btn btn-primary btn-sm" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
        <button class="btn btn-outline btn-sm" id="logoutBtn" style="display:none;"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </header>

  <div class="search-section">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Buscar en inglés o español...">
    </div>
  </div>

  <div class="add-form">
    <div class="field-group">
      <label><i class="fas fa-quote-right"></i> Inglés</label>
      <input type="text" id="newEnglish" placeholder="Ej: Break a leg" />
    </div>
    <div class="field-group">
      <label><i class="fas fa-quote-left"></i> Español</label>
      <input type="text" id="newSpanish" placeholder="Ej: Buena suerte" />
    </div>
    <button class="btn" id="addBtn"><i class="fas fa-plus-circle"></i> Añadir</button>
  </div>

  <div class="stats">
    <div>
      <span><i class="fas fa-database"></i> Total: <strong id="totalCount">0</strong> expresiones</span>
      <span><i class="fas fa-filter"></i> Mostrando: <strong id="visibleCount">0</strong></span>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn-export" id="exportBtn"><i class="fas fa-download"></i> Exportar CSV</button>
      <button class="btn-import" id="importBtn"><i class="fas fa-upload"></i> Importar CSV</button>
      <input type="file" id="fileInput" class="file-input-hidden" accept=".csv">
    </div>
  </div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th style="width:5%;">#</th>
          <th style="width:40%;">Inglés (English)</th>
          <th style="width:40%;">Español (Spanish)</th>
          <th style="width:15%;">Acciones</th>
        </tr>
      </thead>
      <tbody id="tableBody">
      </tbody>
    </table>
  </div>
  <div style="margin-top: 12px; font-size:0.85rem; color:#5b708b; text-align:right;">
    <i class="fas fa-save" style="margin-right:4px;"></i> Los datos se guardan automáticamente en tu navegador
  </div>
</div>

    // ----- PERSISTENCIA CON LOCALSTORAGE -----
    const STORAGE_KEY = 'bilingue_expressions';

    function loadFromStorage() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed;
          }
        }
      } catch (e) {}
      return null;
    }

    function saveToStorage(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        console.warn('No se pudo guardar en localStorage');
      }
    }

    // Inicializar datos
    let storedData = loadFromStorage();
    let expressions;
    if (storedData) {
      expressions = storedData;
    } else {
      const initial = generateInitialData();
      expressions = initial.map((item, index) => ({
        id: index + 1,
        english: item.english,
        spanish: item.spanish
      }));
      saveToStorage(expressions);
    }

    let nextId = expressions.length > 0 ? Math.max(...expressions.map(e => e.id)) + 1 : 1;
    let searchTerm = '';
    let isLoggedIn = false;

    // DOM refs
    const tbody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userStatus = document.getElementById('userStatus');
    const addBtn = document.getElementById('addBtn');
    const newEnglish = document.getElementById('newEnglish');
    const newSpanish = document.getElementById('newSpanish');
    const toast = document.getElementById('toast');
    const totalCount = document.getElementById('totalCount');
    const visibleCount = document.getElementById('visibleCount');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const fileInput = document.getElementById('fileInput');

    function showToast(msg, duration = 2000) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    function filterData() {
      return expressions.filter(item => {
        const matchSearch = 
          item.english.toLowerCase().includes(searchTerm.toLowerCase()) ||
          item.spanish.toLowerCase().includes(searchTerm.toLowerCase());
        return matchSearch;
      });
    }

    function render() {
      const filtered = filterData();
      totalCount.textContent = expressions.length;
      visibleCount.textContent = filtered.length;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-message">🔍 No hay expresiones que coincidan</td></tr>`;
        return;
      }

      let html = '';
      filtered.forEach((item, index) => {
        html += `<tr>
          <td>${index + 1}</td>
          <td class="col-ingles">${item.english}</td>
          <td class="col-espanol">${item.spanish}</td>
          <td>
            <button class="btn btn-danger btn-sm delete-btn" data-id="${item.id}" ${!isLoggedIn ? 'disabled style="opacity:0.4; pointer-events:none;"' : ''}>
              <i class="fas fa-trash-alt"></i> Eliminar
            </button>
          </td>
        </tr>`;
      });
      tbody.innerHTML = html;

      if (isLoggedIn) {
        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            const id = parseInt(this.dataset.id);
            expressions = expressions.filter(exp => exp.id !== id);
            saveToStorage(expressions);
            render();
            showToast('🗑️ Expresión eliminada', 1500);
          });
        });
      }
    }

    function login() {
      isLoggedIn = true;
      userStatus.innerHTML = `<i class="fas fa-user-check"></i> Usuario (logueado)`;
      loginBtn.style.display = 'none';
      logoutBtn.style.display = 'inline-flex';
      showToast('✅ Sesión iniciada · ya puedes eliminar', 1800);
      render();
    }

    function logout() {
      isLoggedIn = false;
      userStatus.innerHTML = `<i class="fas fa-user-circle"></i> Invitado`;
      loginBtn.style.display = 'inline-flex';
      logoutBtn.style.display = 'none';
      showToast('🔓 Sesión cerrada', 1500);
      render();
    }

    loginBtn.addEventListener('click', login);
    logoutBtn.addEventListener('click', logout);

    function addExpression() {
      const eng = newEnglish.value.trim();
      const esp = newSpanish.value.trim();
      if (!eng || !esp) {
        showToast('⚠️ Completa ambos campos', 1800);
        return;
      }
      const newItem = {
        id: nextId++,
        english: eng,
        spanish: esp
      };
      expressions.push(newItem);
      saveToStorage(expressions);
      newEnglish.value = '';
      newSpanish.value = '';
      render();
      showToast('✨ Expresión añadida · guardada en tu navegador', 1800);
    }

    addBtn.addEventListener('click', addExpression);
    newEnglish.addEventListener('keydown', (e) => { if(e.key === 'Enter') addExpression(); });
    newSpanish.addEventListener('keydown', (e) => { if(e.key === 'Enter') addExpression(); });

    searchInput.addEventListener('input', function() {
      searchTerm = this.value;
      render();
    });

    // Exportar CSV
    exportBtn.addEventListener('click', function() {
      let csv = 'Inglés,Español\n';
      expressions.forEach(item => {
        const eng = item.english.includes(',') ? `"${item.english}"` : item.english;
        const esp = item.spanish.includes(',') ? `"${item.spanish}"` : item.spanish;
        csv += `${eng},${esp}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'expresiones_bilingue.csv';
      link.click();
      URL.revokeObjectURL(link.href);
      showToast('📥 CSV exportado con ' + expressions.length + ' expresiones', 2000);
    });

    // Importar CSV
    importBtn.addEventListener('click', function() {
      fileInput.click();
    });

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const text = event.target.result;
          const lines = text.split('\n').filter(line => line.trim() !== '');
          
          // Saltar cabecera si existe
          let startIndex = 0;
          if (lines[0].toLowerCase().includes('inglés') || lines[0].toLowerCase().includes('english')) {
            startIndex = 1;
          }

          let imported = 0;
          let skipped = 0;
          const newExpressions = [];

          for (let i = startIndex; i < lines.length; i++) {
            const line = lines[i].trim();
            // Intentar parsear CSV respetando comillas
            let parts = [];
            let current = '';
            let inQuotes = false;
            
            for (let j = 0; j < line.length; j++) {
              const char = line[j];
              if (char === '"') {
                inQuotes = !inQuotes;
              } else if (char === ',' && !inQuotes) {
                parts.push(current.trim());
                current = '';
              } else {
                current += char;
              }
            }
            parts.push(current.trim());

            // Si no se pudo parsear con comillas, intentar split simple
            if (parts.length < 2) {
              parts = line.split(',').map(s => s.trim());
            }

            if (parts.length >= 2) {
              const english = parts[0].replace(/^"|"$/g, '').trim();
              const spanish = parts.slice(1).join(',').replace(/^"|"$/g, '').trim();
              
              if (english && spanish) {
                newExpressions.push({
                  id: nextId++,
                  english: english,
                  spanish: spanish
                });
                imported++;
              } else {
                skipped++;
              }
            } else {
              skipped++;
            }
          }

          if (newExpressions.length > 0) {
            expressions = expressions.concat(newExpressions);
            saveToStorage(expressions);
            render();
            showToast(`📥 Importadas ${imported} expresiones${skipped > 0 ? `, ${skipped} líneas omitidas` : ''}`, 3000);
          } else {
            showToast('⚠️ No se encontraron expresiones válidas en el archivo', 2500);
          }

          // Resetear input
          fileInput.value = '';
        } catch (error) {
          showToast('❌ Error al leer el archivo CSV', 2500);
          console.error(error);
          fileInput.value = '';
        }
      };

      reader.onerror = function() {
        showToast('❌ Error al leer el archivo', 2000);
        fileInput.value = '';
      };

      reader.readAsText(file, 'UTF-8');
    });

    render();
  })();
</script>
</body>
</html>
